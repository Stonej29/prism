[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.1.0"
description = "Personal Research Interlinked System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=21.11,<22",
  "PyYAML>=6.0.2,<7",
  "httpx>=0.28.1,<0.29",
  "trafilatura>=2.0.0,<3",
  "PyMuPDF>=1.25.0,<2",
  "lancedb>=0.18.0,<0.19",
]

[project.scripts]
prism-bot = "prism.bot:main"

[tool.setuptools.packages.find]
where = ["src"]
