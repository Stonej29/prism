# PRISM worker feed configuration.
# Copy to runtime/feeds.yaml (the path in PRISM_FEEDS_PATH, default /data/feeds.yaml).
# Edits take effect on the next worker restart. The worker starts fine with no
# feeds configured.

feeds:
  # "rss": save each feed entry's own link (one note per entry).
  #   - type: rss
  #     url: https://some-single-topic-blog.com/feed
  #     max: 20
  #
  # "digest": for roundup newsletters where each post links to many items,
  # follow the "Read more" links (repos / papers / project pages) and save each
  # as its own note — one tech per note — instead of the digest post itself.
  - type: digest
    url: https://aisearch.substack.com/feed
    posts: 4          # expand the newest N posts each run (overlap + dedup avoids misses)
    # input_source tags how these notes entered PRISM (default: ai_search).
    input_source: ai_search

schedule:
  # 5-field cron expressions, interpreted in `timezone` (DST-aware).
  timezone: Europe/Copenhagen
  ingestion: "0 7 * * *"   # daily 07:00 — pull feeds
  traversal: "0 5 * * 1"   # weekly Monday 05:00 — graph maintenance

# Graph traversal each run:
#   * recomputes automatic related-note links (bounded; never piles up)
#   * normalizes near-duplicate tags corpus-wide (e.g. foundation-model(s)) — auto
#   * proposes near-duplicate note merges for review via /proposals (not auto-applied)
traversal_enabled: true
