services:
  prism:
    build: .
    user: "${PRISM_UID:-1000}:${PRISM_GID:-1000}"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./runtime:/data:z
    restart: unless-stopped

  prism-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    user: "${PRISM_UID:-1000}:${PRISM_GID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      PRISM_WEB_HOST: 0.0.0.0
      PRISM_WEB_PORT: 5890
    ports:
      - "5890:5890"
    volumes:
      - ./runtime:/data:z
    restart: unless-stopped

  prism-worker:
    build: .
    command: ["prism-worker"]
    user: "${PRISM_UID:-1000}:${PRISM_GID:-1000}"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./runtime:/data:z
    restart: unless-stopped
